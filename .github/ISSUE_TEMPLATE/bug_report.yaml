name: Android bug report
description: Report a StreamFarvis Android problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [existing issues](https://github.com/FloKuersten/StreamFarvis/issues) first.
        Never include TMDB tokens or personal data. Report vulnerabilities [privately](https://github.com/FloKuersten/StreamFarvis/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: App version and APK build
      description: Include the version and whether this is a published release, debug APK, or self-built APK. Add the commit if self-built.
      placeholder: "1.0.0, published release APK"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 7, Android 15; or emulator, API 36"
    validations:
      required: true
  - type: input
    id: webview
    attributes:
      label: Android System WebView version
      description: Find this in Android Settings > Apps > Android System WebView. Say unknown if unavailable.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Player source, if applicable
      description: Name the selected source and whether one title or several are affected. Do not paste private playback URLs.
      placeholder: "Videasy; several titles, or not applicable"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the exact visible error, if any.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant logs
      description: Attach files here or paste a short log excerpt. Remove tokens, credentials, private URLs, and personal information first.
