name: Android feature request
description: Suggest a focused improvement to StreamFarvis.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [current Android limits](https://github.com/FloKuersten/StreamFarvis#current-limits) and check existing issues before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and what currently makes it difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe the result you would like. Screenshots or sketches can be attached here.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Optional; include anything you have already tried.
  - type: input
    id: environment
    attributes:
      label: App version and Android device
      placeholder: "1.0.0, Pixel 7, Android 15"
